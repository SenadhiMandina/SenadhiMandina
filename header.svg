<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Senadhi Mandina - lofi coding banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c2e"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #fff; letter-spacing: 1px; }
    .sub   { font-family: 'Courier New', monospace; font-size: 17px; fill: #fbcfe8; }
    .bub   { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #3b0764; text-anchor: middle; opacity: 0; animation: say 16s infinite; }
    .sym   { font-family: 'Courier New', monospace; font-weight: bold; fill: #f9a8d4; opacity: 0; animation: float 7s infinite; }
    .zzz   { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #e9d5ff; opacity: 0; animation: zz 3.5s infinite; }
    .star  { fill: #fff; animation: twinkle 3s infinite; }
    .code  { transform-box: fill-box; transform-origin: left center; animation: type 6s infinite; }
    .tail  { transform-origin: 322px 312px; animation: wag 2.4s ease-in-out infinite; }
    .steam { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: 0; animation: steam 3s infinite; }
    .cursor{ animation: blink 1s steps(2) infinite; }
    .moon  { animation: bob 6s ease-in-out infinite; }

    @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
    @keyframes type { 0%{transform:scaleX(0)} 55%,90%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
    @keyframes wag { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(14deg)} }
    @keyframes steam { 0%{opacity:0; transform:translateY(6px)} 40%{opacity:.7} 100%{opacity:0; transform:translateY(-14px)} }
    @keyframes blink { 0%{opacity:1} 100%{opacity:0} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes say { 0%{opacity:0} 3%{opacity:1} 22%{opacity:1} 25%{opacity:0} 100%{opacity:0} }
    @keyframes float { 0%{opacity:0; transform:translateY(20px)} 20%{opacity:.8} 100%{opacity:0; transform:translateY(-60px)} }
    @keyframes zz { 0%{opacity:0; transform:translate(0,0)} 30%{opacity:1} 100%{opacity:0; transform:translate(14px,-26px)} }
  </style>

  <!-- Sky -->
  <rect width="900" height="420" fill="url(#sky)"/>

  <!-- Moon -->
  <g class="moon">
    <circle cx="780" cy="85" r="70" fill="url(#moonGlow)"/>
    <circle cx="780" cy="85" r="30" fill="#fef9c3"/>
    <circle cx="770" cy="78" r="6" fill="#fde68a" opacity=".7"/>
    <circle cx="790" cy="96" r="4" fill="#fde68a" opacity=".7"/>
  </g>

  <!-- Stars -->
  <circle class="star" cx="60"  cy="40"  r="2"   style="animation-delay:0s"/>
  <circle class="star" cx="140" cy="90"  r="1.5" style="animation-delay:.6s"/>
  <circle class="star" cx="220" cy="30"  r="2"   style="animation-delay:1.2s"/>
  <circle class="star" cx="310" cy="70"  r="1.5" style="animation-delay:1.8s"/>
  <circle class="star" cx="420" cy="25"  r="2"   style="animation-delay:.3s"/>
  <circle class="star" cx="520" cy="60"  r="1.5" style="animation-delay:2.1s"/>
  <circle class="star" cx="610" cy="35"  r="2"   style="animation-delay:.9s"/>
  <circle class="star" cx="690" cy="110" r="1.5" style="animation-delay:1.5s"/>
  <circle class="star" cx="860" cy="150" r="2"   style="animation-delay:2.4s"/>
  <circle class="star" cx="40"  cy="170" r="1.5" style="animation-delay:1s"/>
  <circle class="star" cx="95"  cy="230" r="2"   style="animation-delay:2s"/>
  <circle class="star" cx="840" cy="250" r="1.5" style="animation-delay:.4s"/>

  <!-- Title -->
  <text class="title" x="450" y="72" text-anchor="middle">Senadhi Mandina</text>
  <text class="sub" x="450" y="102" text-anchor="middle">CS Undergrad  •  Aspiring Software Engineer  •  Coffee-powered</text>

  <!-- Floating code symbols -->
  <text class="sym" x="90"  y="330" font-size="26" style="animation-delay:0s">&lt;/&gt;</text>
  <text class="sym" x="170" y="350" font-size="22" style="animation-delay:2s">{ }</text>
  <text class="sym" x="760" y="340" font-size="26" style="animation-delay:1s">;</text>
  <text class="sym" x="820" y="320" font-size="22" style="animation-delay:3.5s">=&gt;</text>
  <text class="sym" x="720" y="360" font-size="20" style="animation-delay:5s">0101</text>

  <!-- Hills / city silhouette -->
  <path d="M0 360 Q120 310 240 350 T480 345 T720 340 T900 335 L900 420 L0 420 Z" fill="#2e1065" opacity=".85"/>
  <path d="M0 385 Q150 350 300 380 T600 375 T900 370 L900 420 L0 420 Z" fill="#1e0b4b"/>

  <!-- Desk -->
  <rect x="190" y="332" width="520" height="14" rx="5" fill="#3b1d6e"/>
  <rect x="215" y="346" width="12" height="60" fill="#2a1250"/>
  <rect x="673" y="346" width="12" height="60" fill="#2a1250"/>

  <!-- Speech bubble -->
  <g>
    <rect x="290" y="128" width="320" height="42" rx="21" fill="#fdf2f8"/>
    <path d="M435 170 L450 188 L462 170 Z" fill="#fdf2f8"/>
    <text class="bub" x="450" y="155" style="animation-delay:0s">// it works on my machine</text>
    <text class="bub" x="450" y="155" style="animation-delay:4s">git commit -m "fixed bug"</text>
    <text class="bub" x="450" y="155" style="animation-delay:8s">99 little bugs in the code...</text>
    <text class="bub" x="450" y="155" style="animation-delay:12s">Ctrl+C, Ctrl+V, Ctrl+Success</text>
  </g>

  <!-- Laptop -->
  <rect x="345" y="212" width="210" height="112" rx="8" fill="#94a3b8"/>
  <rect x="352" y="219" width="196" height="98" rx="4" fill="url(#screenGlow)"/>
  <rect x="330" y="322" width="240" height="12" rx="5" fill="#cbd5e1"/>
  <rect x="425" y="322" width="50" height="4" rx="2" fill="#94a3b8"/>

  <!-- Typing code lines -->
  <rect class="code" x="362" y="230" width="60"  height="6" rx="3" fill="#f472b6" style="animation-delay:0s"/>
  <rect class="code" x="376" y="242" width="110" height="6" rx="3" fill="#a78bfa" style="animation-delay:.4s"/>
  <rect class="code" x="376" y="254" width="85"  height="6" rx="3" fill="#67e8f9" style="animation-delay:.8s"/>
  <rect class="code" x="376" y="266" width="125" height="6" rx="3" fill="#fde68a" style="animation-delay:1.2s"/>
  <rect class="code" x="362" y="278" width="40"  height="6" rx="3" fill="#f472b6" style="animation-delay:1.6s"/>
  <rect class="code" x="376" y="290" width="95"  height="6" rx="3" fill="#86efac" style="animation-delay:2s"/>
  <rect class="cursor" x="476" y="289" width="7" height="9" fill="#fff"/>

  <!-- Coffee mug -->
  <rect x="598" y="300" width="34" height="32" rx="6" fill="#fff"/>
  <path d="M632 308 q16 2 0 18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <rect x="601" y="303" width="28" height="6" rx="3" fill="#7c2d12"/>
  <path class="steam" d="M607 294 q-5 -8 0 -14" style="animation-delay:0s"/>
  <path class="steam" d="M615 294 q-5 -8 0 -14" style="animation-delay:1s"/>
  <path class="steam" d="M623 294 q-5 -8 0 -14" style="animation-delay:2s"/>

  <!-- Sleeping cat -->
  <path class="tail" d="M322 318 q28 -6 24 -30" fill="none" stroke="#1f1b2e" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="285" cy="316" rx="40" ry="18" fill="#1f1b2e"/>
  <circle cx="252" cy="304" r="17" fill="#1f1b2e"/>
  <path d="M238 296 L240 278 L252 290 Z" fill="#1f1b2e"/>
  <path d="M266 296 L264 278 L252 290 Z" fill="#1f1b2e"/>
  <path d="M244 303 q4 4 8 0" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M254 303 q4 4 8 0" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="253" cy="309" r="1.8" fill="#f472b6"/>
  <text class="zzz" x="268" y="282" font-size="18" style="animation-delay:0s">z</text>
  <text class="zzz" x="276" y="270" font-size="14" style="animation-delay:1.2s">z</text>
  <text class="zzz" x="283" y="260" font-size="11" style="animation-delay:2.4s">z</text>
</svg>
